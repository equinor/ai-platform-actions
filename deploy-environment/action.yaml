name: Deploy Environment
description: Deploy an Environment to AzureML
inputs:
  tenant-id:
    description: 'Tenant id'
    required: true
  subscription-id:
    description: 'Azure subscription id'
    required: true
  resource-group:
    description: 'Azure resource group'
    required: true
  workspace-name:
    description: 'Azure Machine Learning workspace name'
    required: true
  client-id:
    description: 'Client id configured with Federated Credentials'
    required: true
  environment-path:
    description: 'Environment definition file with full path'
    required: true

outputs:
  resource-id:
    description: 'resource id of the environment'
    value: ${{ steps.create_environment.outputs.resource-id }}
  environment-ref:
    description: 'reference string of environment within AzureML workspace'
    value: ${{ steps.ref_ver.outputs.environment-ref }}
  environment-version:
    description: 'The registered version of the environment within the workspace'
    value: ${{ steps.ref_ver.outputs.environment-version }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        VALIDATION_ERRORS=0
        
        # Check required inputs
        if [ -z "${{ inputs.tenant-id }}" ]; then
          echo "❌ Error: tenant-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.subscription-id }}" ]; then
          echo "❌ Error: subscription-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.resource-group }}" ]; then
          echo "❌ Error: resource-group is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.workspace-name }}" ]; then
          echo "❌ Error: workspace-name is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.client-id }}" ]; then
          echo "❌ Error: client-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.environment-path }}" ]; then
          echo "❌ Error: environment-path is required but not provided"
          echo "   Please specify the path to your environment YAML file"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        elif [ ! -f "${{ inputs.environment-path }}" ]; then
          echo "❌ Error: Environment file not found: ${{ inputs.environment-path }}"
          echo "   Please ensure the file exists and the path is correct"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        # Check for validation errors and exit if any found
        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "❌ Validation failed with $VALIDATION_ERRORS error(s). Please fix the above issues and try again."
          exit 1
        fi
        
        echo "✅ Input validation passed"

    - name: Deployment summary
      shell: bash
      run: |
        echo "About to deploy Azure ML environment from: ${{ inputs.environment-path }}"
        echo "   Target workspace: ${{ inputs.workspace-name }} (Resource Group: ${{ inputs.resource-group }})"

    - name: Az ml
      shell: bash
      run: |
        az extension add -n ml -y

    - name: Create Environment
      shell: bash
      id: create_environment
      run: |
        echo "resource-id=$(\
        az ml environment create \
        --file ${{ inputs.environment-path }} \
        -g ${{ inputs.resource-group }} \
        -w ${{ inputs.workspace-name }} \
        --subscription ${{ inputs.subscription-id }} \
        --query "id" \
        --output tsv \
        )" >> "$GITHUB_OUTPUT"

    - name: Ref and version
      shell: bash
      id: ref_ver
      run: |
        echo "environment-ref=$(\
        echo "${{ steps.create_environment.outputs.resource-id }}" | awk -F '/' '{printf("azureml:%s:%s\n"),$11,$13 }'
        )" >> "$GITHUB_OUTPUT"
        echo "environment-version=$(\
        echo "${{ steps.create_environment.outputs.resource-id }}" | awk -F '/' '{print $13}'
        )" >> "$GITHUB_OUTPUT"

    - name: Print Result
      shell: bash
      run: |
        echo "Resource ID of AzureML Environment: ${{ steps.create_environment.outputs.resource-id }}"
        echo "Reference uri of AzureML Environment within workspace: ${{ steps.ref_ver.outputs.environment-ref }}"
        echo "Version of AzureML Environment within workspace: ${{ steps.ref_ver.outputs.environment-version }}"
