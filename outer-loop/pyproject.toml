[project]
name = "aip-outer"
version = "0.1.0"
description = "ML experiment analytics and evaluation for Azure ML outer-loop workflows"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-ml>=1.30.0",
    "azure-core>=1.37.0",
    "azure-identity>=1.25.1",
    "azureml-mlflow>=1.59.0",
    "mlflow>=3.11.1",
    "PyJWT>=2.13.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Warnings are errors so first-party regressions cannot hide. The ignores below
# are azure-ai-ml's schema definitions tripping marshmallow 3.x deprecations at
# import time; remove them once azure-ai-ml is marshmallow 4 ready.
filterwarnings = [
    "error",
    "ignore::marshmallow.warnings.RemovedInMarshmallow4Warning",
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]
