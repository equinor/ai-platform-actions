[project]
name = "aip-outer"
version = "0.1.0"
description = "ML experiment analytics and evaluation for Azure ML outer-loop workflows"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-ml>=1.30.0",
    "azure-core>=1.37.0",
    "azure-identity>=1.25.1",
    "PyJWT>=2.12.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]
