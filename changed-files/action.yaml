name: Changed Files
description: Detect changed Azure ML assets by monitoring YAML definition files and their related source files (Python, Dockerfiles, etc.)
inputs:
  base-ref:
    description: 'Base reference for comparison (optional - auto-detected from event)'
    required: false
  head-ref:
    description: 'Head reference for comparison (optional - auto-detected from event)'
    required: false
  filter-pattern:
    description: 'Pattern to filter changed files (e.g., "*.yaml", "components/**", etc.)'
    required: false
  ignore-pattern:
    description: 'Pattern to ignore changed files (e.g., "test/**", "*.md", etc.) - takes precedence over filter-pattern'
    required: false
  output-format:
    description: 'Output format: "space-separated", "json", "newline-separated"'
    default: 'space-separated'
    required: false

outputs:
  changed-files:
    description: 'List of changed Azure ML asset paths'
    value: ${{ steps.detect-changes.outputs.changed-files }}
  changed-files-json:
    description: 'JSON array of Azure ML assets with asset-type and asset-path fields (deploy-x compatible)'
    value: ${{ steps.detect-changes.outputs.changed-files-json }}
  has-changes:
    description: 'Whether any Azure ML assets were affected by changes'
    value: ${{ steps.detect-changes.outputs.has-changes }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        VALIDATION_ERRORS=0
        
        # Check base-ref format if provided
        if [ -n "${{ inputs.base-ref }}" ]; then
          if [[ ! "${{ inputs.base-ref }}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "❌ Error: Invalid base-ref format: ${{ inputs.base-ref }}"
            echo "   base-ref should be a valid git reference (branch, tag, or commit SHA)"
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          fi
        fi
        
        # Check head-ref format if provided
        if [ -n "${{ inputs.head-ref }}" ]; then
          if [[ ! "${{ inputs.head-ref }}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
            echo "❌ Error: Invalid head-ref format: ${{ inputs.head-ref }}"
            echo "   head-ref should be a valid git reference (branch, tag, or commit SHA)"
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
          fi
        fi
        
        # Validate output-format
        case "${{ inputs.output-format }}" in
          "space-separated"|"json"|"newline-separated")
            ;;
          *)
            echo "❌ Error: Invalid output-format: ${{ inputs.output-format }}"
            echo "   Valid formats: space-separated, json, newline-separated"
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
            ;;
        esac
        
        # Check for validation errors and exit if any found
        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "❌ Validation failed with $VALIDATION_ERRORS error(s). Please fix the above issues and try again."
          exit 1
        fi
        

        echo "✅ Input validation passed"

    - name: Input summary
      shell: bash
      run: |
        echo "🔎 changed-files input summary:"
        echo "  base-ref:      '${{ inputs.base-ref }}'"
        echo "  head-ref:      '${{ inputs.head-ref }}'"
        echo "  filter-pattern:'${{ inputs.filter-pattern }}'"
        echo "  ignore-pattern:'${{ inputs.ignore-pattern }}'"
        echo "  output-format: '${{ inputs.output-format }}'"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Ensure git references are available
      shell: bash
      run: |
        # Determine base and head references
        if [ -n "${{ inputs.base-ref }}" ] && [ -n "${{ inputs.head-ref }}" ]; then
          BASE_REF="${{ inputs.base-ref }}"
          HEAD_REF="${{ inputs.head-ref }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
        elif [ "${{ github.event_name }}" = "merge_group" ]; then
          BASE_REF="${{ github.event.merge_group.base_sha }}"
          HEAD_REF="${{ github.event.merge_group.head_sha }}"
        else
          BASE_REF="${{ github.event.before }}"
          HEAD_REF="${{ github.event.after }}"
        fi
        
        echo "Event name: ${{ github.event_name }}"
        echo "Checking availability of references:"
        echo "Base: $BASE_REF"
        echo "Head: $HEAD_REF"
        
        # Try to resolve the references to ensure they exist
        if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
          echo "Warning: Base reference '$BASE_REF' not found locally, attempting to fetch..."
          # Try to fetch the specific reference if it's a commit SHA
          if [[ "$BASE_REF" =~ ^[a-f0-9]{7,40}$ ]]; then
            # It's likely a commit SHA, try to fetch more history
            git fetch origin --unshallow 2>/dev/null || git fetch origin --depth=1000 || echo "Could not fetch additional history"
          else
            # It's likely a branch or tag, try to fetch it specifically
            git fetch origin "$BASE_REF:$BASE_REF" 2>/dev/null || git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" 2>/dev/null || echo "Could not fetch branch/tag $BASE_REF"
          fi
        fi
        
        if ! git rev-parse --verify "$HEAD_REF" >/dev/null 2>&1; then
          echo "Warning: Head reference '$HEAD_REF' not found locally, attempting to fetch..."
          if [[ "$HEAD_REF" =~ ^[a-f0-9]{7,40}$ ]]; then
            git fetch origin --unshallow 2>/dev/null || git fetch origin --depth=1000 || echo "Could not fetch additional history"
          else
            git fetch origin "$HEAD_REF:$HEAD_REF" 2>/dev/null || git fetch origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF" 2>/dev/null || echo "Could not fetch branch/tag $HEAD_REF"
          fi
        fi
        
        # Final verification
        if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
          echo "❌ Error: Cannot resolve base reference '$BASE_REF'"
          echo "This could be because:"
          echo "  - The commit SHA doesn't exist in this repository"
          echo "  - The branch/tag name is incorrect"
          echo "  - The commit is not reachable from the current checkout"
          exit 1
        fi
        
        if ! git rev-parse --verify "$HEAD_REF" >/dev/null 2>&1; then
          echo "❌ Error: Cannot resolve head reference '$HEAD_REF'"
          exit 1
        fi
        
        echo "✅ Both references are available"

    - name: Detect changes
      shell: bash
      id: detect-changes
      run: |
        # Determine base and head references based on event type
        if [ -n "${{ inputs.base-ref }}" ] && [ -n "${{ inputs.head-ref }}" ]; then
          BASE_SHA="${{ inputs.base-ref }}"
          HEAD_SHA="${{ inputs.head-ref }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        elif [ "${{ github.event_name }}" = "merge_group" ]; then
          BASE_SHA="${{ github.event.merge_group.base_sha }}"
          HEAD_SHA="${{ github.event.merge_group.head_sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.event.after }}"
        fi
        # Resolve references to actual commit SHAs for reliable comparison
        BASE_COMMIT=$(git rev-parse "$BASE_SHA")
        HEAD_COMMIT=$(git rev-parse "$HEAD_SHA")
        echo "Comparing $BASE_COMMIT..$HEAD_COMMIT"
        echo "Base ref: $BASE_SHA -> $BASE_COMMIT"
        echo "Head ref: $HEAD_SHA -> $HEAD_COMMIT"
        # Get all changed files using the resolved commit SHAs
        CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" "$HEAD_COMMIT")
        # Apply ignore pattern first (takes precedence)
        if [ -n "${{ inputs.ignore-pattern }}" ]; then
          FILTERED_FILES=""
          IGNORE_PATTERN="${{ inputs.ignore-pattern }}"
          while IFS= read -r file; do
            if [[ ! "$file" == $IGNORE_PATTERN ]]; then
              if [ -z "$FILTERED_FILES" ]; then
                FILTERED_FILES="$file"
              else
                FILTERED_FILES=$(printf "%s\n%s" "$FILTERED_FILES" "$file")
              fi
            fi
          done <<< "$CHANGED_FILES"
          CHANGED_FILES="$FILTERED_FILES"
        fi
        # Apply filter pattern (if specified and no ignore pattern conflicts)
        if [ -n "${{ inputs.filter-pattern }}" ]; then
          FILTERED_FILES=""
          FILTER_PATTERN="${{ inputs.filter-pattern }}"
          while IFS= read -r file; do
            if [[ "$file" == $FILTER_PATTERN ]]; then
              if [ -z "$FILTERED_FILES" ]; then
                FILTERED_FILES="$file"
              else
                FILTERED_FILES=$(printf "%s\n%s" "$FILTERED_FILES" "$file")
              fi
            fi
          done <<< "$CHANGED_FILES"
          CHANGED_FILES="$FILTERED_FILES"
        fi
        # First, find all Azure ML asset YAML files in the repository to build a mapping
        echo "Building asset file mapping..."
        ASSET_MAP_FILE=$(mktemp)
        find . -name "*.yaml" -o -name "*.yml" | while read -r yaml_file; do
          if [ -f "$yaml_file" ]; then
            SCHEMA_LINE=$(head -n 1 "$yaml_file" | grep '\$schema:' || true)
            ASSET_TYPE="unknown"
            if [[ "$SCHEMA_LINE" == *"commandComponent.schema.json"* ]]; then
              ASSET_TYPE="component"
            elif [[ "$SCHEMA_LINE" == *"environment.schema.json"* ]]; then
              ASSET_TYPE="environment"
            elif [[ "$SCHEMA_LINE" == *"data.schema.json"* ]]; then
              ASSET_TYPE="data"
            elif [[ "$SCHEMA_LINE" == *"mltable.schema.json"* ]]; then
              ASSET_TYPE="data"
            elif [[ "$SCHEMA_LINE" == *"commandJob.schema.json"* ]]; then
              ASSET_TYPE="job"
            elif [[ "$SCHEMA_LINE" == *"pipelineJob.schema.json"* ]]; then
              ASSET_TYPE="job"
            fi
            if [[ "$ASSET_TYPE" != "unknown" ]]; then
              # Store: asset_type|yaml_path|directory_path
              YAML_DIR=$(dirname "$yaml_file")
              echo "$ASSET_TYPE|$yaml_file|$YAML_DIR" >> "$ASSET_MAP_FILE"
            fi
          fi
        done

        # Process changed files and determine affected assets
        ASSET_LIST="[]"
        PROCESSED_ASSETS=""
        
        while IFS= read -r file; do
          # Direct YAML asset file change
          if [[ "$file" =~ \.(yaml|yml)$ ]] && [ -f "$file" ]; then
            SCHEMA_LINE=$(head -n 1 "$file" | grep '\$schema:' || true)
            ASSET_TYPE="unknown"
            if [[ "$SCHEMA_LINE" == *"commandComponent.schema.json"* ]]; then
              ASSET_TYPE="component"
            elif [[ "$SCHEMA_LINE" == *"environment.schema.json"* ]]; then
              ASSET_TYPE="environment"
            elif [[ "$SCHEMA_LINE" == *"data.schema.json"* ]]; then
              ASSET_TYPE="data"
            elif [[ "$SCHEMA_LINE" == *"mltable.schema.json"* ]]; then
              ASSET_TYPE="data"
            elif [[ "$SCHEMA_LINE" == *"commandJob.schema.json"* ]]; then
              ASSET_TYPE="job"
            elif [[ "$SCHEMA_LINE" == *"pipelineJob.schema.json"* ]]; then
              ASSET_TYPE="job"
            fi
            # Add to asset list if type is recognized and not already processed
            if [[ "$ASSET_TYPE" != "unknown" ]] && [[ ! "$PROCESSED_ASSETS" =~ "$file" ]]; then
              ASSET_LIST=$(echo "$ASSET_LIST" | jq --arg type "$ASSET_TYPE" --arg path "$file" '. += [{"asset-type": $type, "asset-path": $path}]')
              PROCESSED_ASSETS="$PROCESSED_ASSETS $file"
              echo "Direct asset change detected: $ASSET_TYPE at $file"
            fi
          else
            # Check if this file change affects any asset directories
            # Look for assets where the changed file is in the same directory or subdirectory
            while IFS='|' read -r asset_type yaml_path yaml_dir; do
              # Check if the changed file is in the asset's directory or subdirectory
              if [[ "$file" == "$yaml_dir"* ]] && [[ ! "$PROCESSED_ASSETS" =~ "$yaml_path" ]]; then
                # Additional filtering for relevant file types per asset type
                SHOULD_INCLUDE=false
                case "$asset_type" in
                  "component")
                    # Components: Python files, notebooks, scripts, config files
                    if [[ "$file" =~ \.(py|ipynb|sh|ps1|yaml|yml|json|txt|md|requirements\.txt|conda\.yaml|conda\.yml)$ ]]; then
                      SHOULD_INCLUDE=true
                    fi
                    ;;
                  "environment")
                    # Environments: Dockerfiles, Python files, conda files, requirements
                    if [[ "$file" =~ \.(py|dockerfile|Dockerfile|yaml|yml|txt|md|requirements\.txt|conda\.yaml|conda\.yml)$ ]] || [[ "$file" == *"Dockerfile"* ]] || [[ "$file" == *"requirements.txt"* ]] || [[ "$file" == *"conda."* ]]; then
                      SHOULD_INCLUDE=true
                    fi
                    ;;
                  "job")
                    # Jobs: Python files, config files, data files
                    if [[ "$file" =~ \.(py|ipynb|yaml|yml|json|txt|md|csv|parquet|pkl|joblib)$ ]]; then
                      SHOULD_INCLUDE=true
                    fi
                    ;;
                  "data")
                    # Data assets: Data files, schema files, processing scripts
                    if [[ "$file" =~ \.(py|csv|parquet|json|txt|md|yaml|yml|pkl|joblib|tsv|xlsx)$ ]]; then
                      SHOULD_INCLUDE=true
                    fi
                    ;;
                esac
                
                if [ "$SHOULD_INCLUDE" = true ]; then
                  ASSET_LIST=$(echo "$ASSET_LIST" | jq --arg type "$asset_type" --arg path "$yaml_path" '. += [{"asset-type": $type, "asset-path": $path}]')
                  PROCESSED_ASSETS="$PROCESSED_ASSETS $yaml_path"
                  echo "Related file change detected: $file affects $asset_type at $yaml_path"
                fi
              fi
            done < "$ASSET_MAP_FILE"
          fi
        done <<< "$CHANGED_FILES"
        
        # Clean up temporary file
        rm -f "$ASSET_MAP_FILE"
        # Check if any assets found
        if [ "$(echo "$ASSET_LIST" | jq 'length')" -eq 0 ]; then
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          echo "changed-files=" >> "$GITHUB_OUTPUT"
          echo "changed-files-json=[]" >> "$GITHUB_OUTPUT"
          echo "No valid AzureML asset files changed"
          exit 0
        else
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
        fi
        
        # Remove duplicates from ASSET_LIST (in case same asset was added multiple times)
        ASSET_LIST=$(echo "$ASSET_LIST" | jq 'unique_by(.["asset-path"])')
        # Format output based on requested format
        case "${{ inputs.output-format }}" in
          "json")
            echo "changed-files=$(echo "$ASSET_LIST" | jq -c '.')" >> "$GITHUB_OUTPUT"
            echo "changed-files-json=$(echo "$ASSET_LIST" | jq -c '.')" >> "$GITHUB_OUTPUT"
            ;;
          "newline-separated")
            # Output asset-paths, one per line
            PATHS=$(echo "$ASSET_LIST" | jq -r '.[]."asset-path"')
            echo "changed-files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$PATHS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "changed-files-json=$(echo "$ASSET_LIST" | jq -c '.')" >> "$GITHUB_OUTPUT"
            ;;
          *)
            # Default: space-separated asset-paths
            SPACE_SEPARATED=$(echo "$ASSET_LIST" | jq -r '.[]."asset-path"' | xargs)
            echo "changed-files=$SPACE_SEPARATED" >> "$GITHUB_OUTPUT"
            echo "changed-files-json=$(echo "$ASSET_LIST" | jq -c '.')" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Print results
      shell: bash
      run: |
        echo "Azure ML assets affected: ${{ steps.detect-changes.outputs.has-changes }}"
        if [ "${{ steps.detect-changes.outputs.has-changes }}" = "true" ]; then
          echo "Affected assets: ${{ steps.detect-changes.outputs.changed-files }}"
          echo "Asset details: ${{ steps.detect-changes.outputs.changed-files-json }}"
          if [ -n "${{ inputs.ignore-pattern }}" ]; then
            echo "Ignore pattern applied: ${{ inputs.ignore-pattern }}"
          fi
          if [ -n "${{ inputs.filter-pattern }}" ]; then
            echo "Filter pattern applied: ${{ inputs.filter-pattern }}"
          fi
          echo "Note: Assets are included when their YAML definition or related source files change"
        fi
