[project]
name = "aip-inner"
version = "0.1.0"
description = "Unified Azure ML operations using command pattern"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-ml>=1.30.0",
    "azure-core>=1.37.0",
    "azure-identity>=1.25.1",
    "cryptography>=50.0.0",
    "Pygments>=2.20.0",
    "PyJWT>=2.13.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "typer>=0.20.0",
]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
    "idna>=3.18",
]

[tool.pytest.ini_options]
# Warnings are errors so first-party regressions cannot hide. The ignores below
# are azure-ai-ml's schema definitions tripping marshmallow 3.x deprecations at
# import time; remove them once azure-ai-ml is marshmallow 4 ready.
filterwarnings = [
    "error",
    "ignore::marshmallow.warnings.RemovedInMarshmallow4Warning",
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]
