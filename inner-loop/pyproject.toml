[project]
name = "aip-inner"
version = "0.1.0"
description = "Unified Azure ML operations using command pattern"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-ml>=1.30.0",
    "azure-core>=1.37.0",
    "azure-identity>=1.25.1",
    "cryptography>=49.0.0",
    "Pygments>=2.20.0",
    "PyJWT>=2.13.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "typer>=0.20.0",
]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
    "idna>=3.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]
