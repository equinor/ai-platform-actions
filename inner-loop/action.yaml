name: Inner Loop
description: Unified action for Azure ML operations using command pattern

inputs:
  verb:
    description: "Action verb (deploy, share, waitfor)"
    required: true
  subject:
    description: "Target subject (data, environment, component, model, job)"
    required: true
  token:
    description: "From azLogin action. Required unless running locally."
    required: false
  expires-on:
    description: "From azLogin action. Required unless running locally."
    required: false
  tenant-id:
    description: "Azure tenant ID"
    required: false
  subscription-id:
    description: "Azure subscription ID"
    required: true
  resource-group:
    description: "Azure resource group name"
    required: true
  workspace-name:
    description: "Azure Machine Learning workspace name"
    required: true
  registry-name:
    description: "Azure ML registry name (for share operations)"
    required: false
  client-id:
    description: "Client ID configured with Federated Credentials"
    required: false
  filepath:
    description: "Path to the configuration file (YAML)"
    required: false
  component-ref:
    description: "Component reference (for share component operations)"
    required: false
  data-ref:
    description: "Data reference (for share data operations)"
    required: false
  env-ref:
    description: "Environment reference (for share environment operations)"
    required: false
  model-ref:
    description: "Model reference (for share model operations)"
    required: false
  job-name:
    description: "Azure ML job name (for waitfor job operations)"
    required: false
  tags:
    description: "Tags to set (format: 'key1=value1,key2=value2')"
    required: false
  promote-stage:
    description: "Stage to promote asset to (for share operations)"
    required: false
  image-build-compute:
    description: "When building environments and you need specific compute instead of serverless, set this to the name of the cluster in the workspace"
    required: false
  timeout-minutes:
    description: "When using waitfor verb, override default timeout of 30"
    required: false
    default: "30"

outputs:
  resource-id:
    description: "Resource ID of the created/shared resource"
  reference:
    description: "Reference string within Azure ML"
  version:
    description: "Version of the resource"

runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.verb }}
    - ${{ inputs.subject }}
    - ${{ inputs.filepath || inputs.component-ref || inputs.data-ref || inputs.env-ref || inputs.model-ref || inputs.job-name }}
    - --subscription
    - ${{ inputs.subscription-id }}
    - --resource-group
    - ${{ inputs.resource-group }}
    - --workspace-name
    - ${{ inputs.workspace-name }}
    - --registry-name
    - ${{ inputs.registry-name }}
    - --token
    - ${{ inputs.token }}
    - --expires-on
    - ${{ inputs.expires-on }}
    - --tags
    - ${{ inputs.tags }}
    - --promote-stage
    - ${{ inputs.promote-stage }}
    - --image-build-compute
    - ${{ inputs.image-build-compute }}
  env:
    UV_NO_INSTALL: "true"  # Add this line to prevent uv from installing dependencies at runtime
    TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
    AZURE_CLIENT_ID: ${{ inputs.client-id }}
    AZURE_TENANT_ID: ${{ inputs.tenant-id }}
    ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
    ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}