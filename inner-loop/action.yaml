name: Inner Loop
description: Unified action for Azure ML operations using command pattern

inputs:
  verb:
    description: "Action verb (deploy, share, waitfor, delete, invoke, promote, rollback)"
    required: true
  subject:
    description: "Target subject (data, environment, component, model, job, online-endpoint, online-deployment, batch-endpoint, batch-deployment)"
    required: true
  token:
    description: "From azLogin action. Required unless running locally."
    required: false
  expires-on:
    description: "From azLogin action. Required unless running locally."
    required: false
  aml-token:
    description: "Access token with Azure ML scope (https://ml.azure.com/.default). Required for job operations."
    required: false
  tenant-id:
    description: "Azure tenant ID"
    required: false
  subscription-id:
    description: "Azure subscription ID"
    required: true
  resource-group:
    description: "Azure resource group name"
    required: true
  workspace-name:
    description: "Azure Machine Learning workspace name"
    required: true
  registry-name:
    description: "Azure ML registry name (for share operations)"
    required: false
  client-id:
    description: "Client ID configured with Federated Credentials"
    required: false
  filepath:
    description: "Path to the configuration file (YAML)"
    required: false
  component-ref:
    description: "Component reference (for share component operations)"
    required: false
  registry-env-ref:
    description: "Reference to environment in a registry for component sharing operations"
    required: false
  data-ref:
    description: "Data reference (for share data operations)"
    required: false
  env-ref:
    description: "Environment reference (for share environment operations)"
    required: false
  model-ref:
    description: "Model reference (for share model operations)"
    required: false
  job-name:
    description: "Azure ML job name (for waitfor job operations)"
    required: false
  endpoint-name:
    description: "Azure ML online endpoint name"
    required: false
  deployment-name:
    description: "Azure ML online deployment name (for deploy online-deployment or rollback online-deployment)"
    required: false
  deployment-resource:
    description: "Azure ML online deployment resource ID (for waitfor/delete online-deployment). Format: /subscriptions/.../onlineEndpoints/<endpoint>/deployments/<deployment>"
    required: false
  traffic-allocation:
    description: "Traffic percentage to allocate to deployment (0-100, for deploy online-deployment)"
    required: false
  tags:
    description: "Tags to set (format: 'key1=value1,key2=value2')"
    required: false
  promote-stage:
    description: "Stage to promote asset to (for share operations)"
    required: false
  image-build-compute:
    description: "When building environments and you need specific compute instead of serverless, set this to the name of the cluster in the workspace"
    required: false
  timeout-minutes:
    description: "When using waitfor verb, override default timeout of 30"
    required: false
  job-ref:
    description: "Job reference (for deploy schedule)"
    required: false
  schedule-name:
    description: "Name for the schedule to be deployed"
    required: false
  cron-expression:
    description: "CRON expression defining the schedule"
    required: false
  time-zone:
    description: "Time zone to use when interpreting the CRON expression"
    required: false
  experiment-name:
    description: "Azure ML experiment name (for deploy job, deploy sweep-job). Overrides the experiment name in the YAML."
    required: false
  input-path:
    description: "Pinned Azure ML data asset or URI used to invoke a batch deployment"
    required: false
  input-type:
    description: "Batch invocation input type (uri_file or uri_folder)"
    required: false
  invocation-job-name:
    description: "Optional deterministic name for a batch invocation job"
    required: false
  expected-current-deployment:
    description: "Expected batch endpoint default used for guarded promotion or rollback"
    required: false

outputs:
  resource-id:
    description: "Resource ID of the created/shared resource"
  reference:
    description: "Reference string within Azure ML"
  version:
    description: "Version of the resource"
  lineage-metadata:
    description: "JSON-encoded lineage metadata for the submitted job (git SHA, branch, workflow run ID)"
  best-trial-run-id:
    description: "Run ID of the best trial in a completed sweep job"
  invocation-job-name:
    description: "Azure ML job created by a named batch deployment invocation"
  status:
    description: "Status of the submitted batch invocation job"
  previous-deployment-name:
    description: "Batch endpoint default before promotion"
  replaced-deployment-name:
    description: "Batch endpoint default replaced during rollback"
  default-deployment-name:
    description: "Batch endpoint default after promotion or rollback"
  changed:
    description: "Whether promotion or rollback changed the endpoint"

runs:
  using: docker
  image: Dockerfile
  env:
    AIP_INNER_ACTION_MODE: "true"
    INPUT_VERB: ${{ inputs.verb }}
    INPUT_SUBJECT: ${{ inputs.subject }}
    INPUT_TOKEN: ${{ inputs.token }}
    INPUT_EXPIRES_ON: ${{ inputs.expires-on }}
    INPUT_AML_TOKEN: ${{ inputs.aml-token }}
    INPUT_TENANT_ID: ${{ inputs.tenant-id }}
    INPUT_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
    INPUT_RESOURCE_GROUP: ${{ inputs.resource-group }}
    INPUT_WORKSPACE_NAME: ${{ inputs.workspace-name }}
    INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
    INPUT_CLIENT_ID: ${{ inputs.client-id }}
    INPUT_FILEPATH: ${{ inputs.filepath }}
    INPUT_COMPONENT_REF: ${{ inputs.component-ref }}
    INPUT_REGISTRY_ENV_REF: ${{ inputs.registry-env-ref }}
    INPUT_DATA_REF: ${{ inputs.data-ref }}
    INPUT_ENV_REF: ${{ inputs.env-ref }}
    INPUT_MODEL_REF: ${{ inputs.model-ref }}
    INPUT_JOB_NAME: ${{ inputs.job-name }}
    INPUT_ENDPOINT_NAME: ${{ inputs.endpoint-name }}
    INPUT_DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
    INPUT_DEPLOYMENT_RESOURCE: ${{ inputs.deployment-resource }}
    INPUT_TRAFFIC_ALLOCATION: ${{ inputs.traffic-allocation }}
    INPUT_TAGS: ${{ inputs.tags }}
    INPUT_PROMOTE_STAGE: ${{ inputs.promote-stage }}
    INPUT_IMAGE_BUILD_COMPUTE: ${{ inputs.image-build-compute }}
    INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
    INPUT_JOB_REF: ${{ inputs.job-ref }}
    INPUT_SCHEDULE_NAME: ${{ inputs.schedule-name }}
    INPUT_CRON_EXPRESSION: ${{ inputs.cron-expression }}
    INPUT_TIME_ZONE: ${{ inputs.time-zone }}
    INPUT_EXPERIMENT_NAME: ${{ inputs.experiment-name }}
    INPUT_INPUT_PATH: ${{ inputs.input-path }}
    INPUT_INPUT_TYPE: ${{ inputs.input-type }}
    INPUT_INVOCATION_JOB_NAME: ${{ inputs.invocation-job-name }}
    INPUT_EXPECTED_CURRENT_DEPLOYMENT: ${{ inputs.expected-current-deployment }}
