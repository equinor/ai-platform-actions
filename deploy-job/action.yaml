name: Deploy Job
description: Deploy a Job to AzureML
inputs:
  tenant-id:
    description: 'Tenant id'
    required: true
  subscription-id:
    description: 'Azure subscription id'
    required: true
  resource-group:
    description: 'Azure resource group'
    required: true
  workspace-name:
    description: 'Azure Machine Learning workspace name'
    required: true
  client-id:
    description: 'Client id configured with Federated Credentials'
    required: true
  job-path:
    description: 'Job definition file with full path'
    required: true
  compute:
    description: 'Name of the compute resource to use (compute or kubernetes cluster within workspace)'
    default: 'serverless'
    required: False

outputs:
  resource-id:
    description: 'resource id of the job'
    value: ${{ steps.create_job.outputs.resource-id }}
  job-ref:
    description: 'reference string of job within AzureML workspace'
    value: ${{ steps.ref_ver.outputs.job-ref }}
  job-name:
    description: 'The name of the job within the workspace'
    value: ${{ steps.ref_ver.outputs.job-name }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        VALIDATION_ERRORS=0
        
        # Check required inputs
        if [ -z "${{ inputs.tenant-id }}" ]; then
          echo "❌ Error: tenant-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.subscription-id }}" ]; then
          echo "❌ Error: subscription-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.resource-group }}" ]; then
          echo "❌ Error: resource-group is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.workspace-name }}" ]; then
          echo "❌ Error: workspace-name is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.client-id }}" ]; then
          echo "❌ Error: client-id is required but not provided"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        if [ -z "${{ inputs.job-path }}" ]; then
          echo "❌ Error: job-path is required but not provided"
          echo "   Please specify the path to your job configuration YAML file"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        elif [ ! -f "${{ inputs.job-path }}" ]; then
          echo "❌ Error: Job configuration file not found: ${{ inputs.job-path }}"
          echo "   Please ensure the file exists and the path is correct"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        # Check for validation errors and exit if any found
        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "❌ Validation failed with $VALIDATION_ERRORS error(s). Please fix the above issues and try again."
          exit 1
        fi
        
        echo "✅ Input validation passed"

    - name: Deployment summary
      shell: bash
      run: |
        echo "About to deploy Azure ML job from: ${{ inputs.job-path }}"
        echo "   Target workspace: ${{ inputs.workspace-name }} (Resource Group: ${{ inputs.resource-group }})"
        if [ -n "${{ inputs.compute }}" ]; then
          echo "   Compute target: ${{ inputs.compute }}"
        else
          echo "   Compute target: serverless (default)"
        fi

    - name: Az ml
      shell: bash
      run: |
        az extension add -n ml -y

    - name: Create Job
      shell: bash
      id: create_job
      run: |
        if [ "${{ inputs.compute }}" = "serverless" ]; then
          echo "resource-id=$(\
          az ml job create \
          --file ${{ inputs.job-path }} \
          -g ${{ inputs.resource-group }} \
          -w ${{ inputs.workspace-name }} \
          --subscription ${{ inputs.subscription-id }} \
          --query "id" \
          --output tsv \
          )" >> "$GITHUB_OUTPUT"
        else
          echo "resource-id=$(\
          az ml job create \
          --file ${{ inputs.job-path }} \
          --set compute=${{ inputs.compute }} \
          -g ${{ inputs.resource-group }} \
          -w ${{ inputs.workspace-name }} \
          --subscription ${{ inputs.subscription-id }} \
          --query "id" \
          --output tsv \
          )" >> "$GITHUB_OUTPUT"
        fi

    - name: Ref and name
      shell: bash
      id: ref_ver
      run: |
        echo "job-ref=$(\
        echo "${{ steps.create_job.outputs.resource-id }}" | awk -F '/' '{printf("azureml:%s\n"),$11 }'
        )" >> "$GITHUB_OUTPUT"
        echo "job-name=$(\
        echo "${{ steps.create_job.outputs.resource-id }}" | awk -F '/' '{print $11}'
        )" >> "$GITHUB_OUTPUT"

    - name: Print Result
      shell: bash
      run: |
        echo "Resource ID of AzureML Job: ${{ steps.create_job.outputs.resource-id }}"
        echo "Reference of AzureML Job within workspace: ${{ steps.ref_ver.outputs.job-ref }}"
        echo "Name of AzureML Job within workspace: ${{ steps.ref_ver.outputs.job-name }}"
