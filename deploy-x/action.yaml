name: Deploy X
description: Universal deployment action for Azure ML assets (environments, components, data, jobs)
inputs:
  tenant-id:
    description: 'Tenant id (optional - falls back to vars.tenant-id)'
    required: false
  subscription-id:
    description: 'Azure subscription id (optional - falls back to vars.subscription-id)'
    required: false
  resource-group:
    description: 'Azure resource group (optional - falls back to vars.resource-group)'
    required: false
  workspace-name:
    description: 'Azure Machine Learning workspace name (optional - falls back to vars.workspace-name)'
    required: false
  client-id:
    description: 'Client id configured with Federated Credentials'
    required: true
  config:
    description: 'Base64-encoded JSON configuration specifying asset-type and parameters. Can be a single object or array of objects.'
    required: true
  index:
    description: 'Index of the configuration item to deploy (for array configs). If not specified, deploys all items sequentially.'
    required: false

outputs:
  resource-id:
    description: 'resource id of the deployed asset'
    value: ${{ steps.deploy_environment.outputs.resource-id || steps.deploy_component.outputs.resource-id || steps.deploy_data.outputs.resource-id || steps.deploy_job.outputs.resource-id }}
  asset-ref:
    description: 'reference string of asset within AzureML workspace'
    value: ${{ steps.deploy_environment.outputs.environment-ref || steps.deploy_component.outputs.component-ref || steps.deploy_data.outputs.data-ref || steps.deploy_job.outputs.job-ref }}
  asset-version:
    description: 'The registered version/name of the asset within the workspace'
    value: ${{ steps.deploy_environment.outputs.environment-version || steps.deploy_component.outputs.component-version || steps.deploy_data.outputs.data-version || steps.deploy_job.outputs.job-name }}

runs:
  using: "composite"
  steps:
    - name: Decode and parse configuration
      shell: bash
      id: parse_config
      run: |
        # Decode base64 config
        CONFIG_JSON=$(echo "${{ inputs.config }}" | base64 -d)
        echo "Decoded config: $CONFIG_JSON"
        
        # Check if config is an array or single object
        if echo "$CONFIG_JSON" | jq -e 'type == "array"' > /dev/null; then
          echo "config-type=array" >> "$GITHUB_OUTPUT"
          ARRAY_LENGTH=$(echo "$CONFIG_JSON" | jq 'length')
          echo "array-length=$ARRAY_LENGTH" >> "$GITHUB_OUTPUT"
          
          # If index is specified, extract that item; otherwise prepare for sequential deployment
          if [ -n "${{ inputs.index }}" ]; then
            INDEX=${{ inputs.index }}
            ITEM=$(echo "$CONFIG_JSON" | jq ".[$INDEX]")
            echo "Selected item at index $INDEX: $ITEM"
            CONFIG_JSON="$ITEM"
          else
            echo "config-json=$CONFIG_JSON" >> "$GITHUB_OUTPUT"
            # For sequential deployment, we'll handle this in a separate step
            exit 0
          fi
        else
          echo "config-type=object" >> "$GITHUB_OUTPUT"
        fi
        
        # Extract asset-type
        ASSET_TYPE=$(echo "$CONFIG_JSON" | jq -r '.["asset-type"]')
        echo "asset-type=$ASSET_TYPE" >> "$GITHUB_OUTPUT"
        
        # Extract asset-path
        ASSET_PATH=$(echo "$CONFIG_JSON" | jq -r '.["asset-path"]')
        echo "asset-path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
        
        # Extract optional parameters
        COMPUTE=$(echo "$CONFIG_JSON" | jq -r '.compute // empty')
        if [ -n "$COMPUTE" ]; then
          echo "compute=$COMPUTE" >> "$GITHUB_OUTPUT"
        fi
        
        TYPE=$(echo "$CONFIG_JSON" | jq -r '.type // empty')
        if [ -n "$TYPE" ]; then
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
        fi

    - name: Set default parameters
      shell: bash
      id: set_defaults
      run: |
        # Set tenant-id
        if [ -n "${{ inputs.tenant-id }}" ]; then
          echo "tenant-id=${{ inputs.tenant-id }}" >> "$GITHUB_OUTPUT"
        else
          echo "tenant-id=${{ vars.tenant-id }}" >> "$GITHUB_OUTPUT"
        fi
        
        # Set subscription-id
        if [ -n "${{ inputs.subscription-id }}" ]; then
          echo "subscription-id=${{ inputs.subscription-id }}" >> "$GITHUB_OUTPUT"
        else
          echo "subscription-id=${{ vars.subscription-id }}" >> "$GITHUB_OUTPUT"
        fi
        
        # Set resource-group
        if [ -n "${{ inputs.resource-group }}" ]; then
          echo "resource-group=${{ inputs.resource-group }}" >> "$GITHUB_OUTPUT"
        else
          echo "resource-group=${{ vars.resource-group }}" >> "$GITHUB_OUTPUT"
        fi
        
        # Set workspace-name
        if [ -n "${{ inputs.workspace-name }}" ]; then
          echo "workspace-name=${{ inputs.workspace-name }}" >> "$GITHUB_OUTPUT"
        else
          echo "workspace-name=${{ vars.workspace-name }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Deploy sequentially (for arrays without index)
      if: ${{ steps.parse_config.outputs.config-type == 'array' && inputs.index == '' }}
      shell: bash
      run: |
        echo "Sequential deployment mode for array with ${{ steps.parse_config.outputs.array-length }} items"
        CONFIG_ARRAY='${{ steps.parse_config.outputs.config-json }}'
        
        for i in $(seq 0 $((${‌{ steps.parse_config.outputs.array-length }} - 1))); do
          echo "Deploying item $i..."
          ITEM=$(echo "$CONFIG_ARRAY" | jq ".[$i]")
          ASSET_TYPE=$(echo "$ITEM" | jq -r '.["asset-type"]')
          ASSET_PATH=$(echo "$ITEM" | jq -r '.["asset-path"]')
          
          echo "Item $i: $ASSET_TYPE at $ASSET_PATH"
          # Note: Sequential deployment calls would need to be implemented here
          # This is a basic framework - full implementation would require calling the individual actions
        done

    - name: Deploy Environment
      if: ${{ (steps.parse_config.outputs.config-type == 'object' || inputs.index != '') && steps.parse_config.outputs.asset-type == 'environment' }}
      uses: ./deploy-environment
      id: deploy_environment
      with:
        tenant-id: ${{ steps.set_defaults.outputs.tenant-id }}
        subscription-id: ${{ steps.set_defaults.outputs.subscription-id }}
        resource-group: ${{ steps.set_defaults.outputs.resource-group }}
        workspace-name: ${{ steps.set_defaults.outputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        environment-path: ${{ steps.parse_config.outputs.asset-path }}

    - name: Deploy Component
      if: ${{ (steps.parse_config.outputs.config-type == 'object' || inputs.index != '') && steps.parse_config.outputs.asset-type == 'component' }}
      uses: ./deploy-component
      id: deploy_component
      with:
        tenant-id: ${{ steps.set_defaults.outputs.tenant-id }}
        subscription-id: ${{ steps.set_defaults.outputs.subscription-id }}
        resource-group: ${{ steps.set_defaults.outputs.resource-group }}
        workspace-name: ${{ steps.set_defaults.outputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        component-path: ${{ steps.parse_config.outputs.asset-path }}

    - name: Deploy Data
      if: ${{ (steps.parse_config.outputs.config-type == 'object' || inputs.index != '') && steps.parse_config.outputs.asset-type == 'data' }}
      uses: ./deploy-data
      id: deploy_data
      with:
        tenant-id: ${{ steps.set_defaults.outputs.tenant-id }}
        subscription-id: ${{ steps.set_defaults.outputs.subscription-id }}
        resource-group: ${{ steps.set_defaults.outputs.resource-group }}
        workspace-name: ${{ steps.set_defaults.outputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        data-path: ${{ steps.parse_config.outputs.asset-path }}
        type: ${{ steps.parse_config.outputs.type }}

    - name: Deploy Job
      if: ${{ (steps.parse_config.outputs.config-type == 'object' || inputs.index != '') && steps.parse_config.outputs.asset-type == 'job' }}
      uses: ./deploy-job
      id: deploy_job
      with:
        tenant-id: ${{ steps.set_defaults.outputs.tenant-id }}
        subscription-id: ${{ steps.set_defaults.outputs.subscription-id }}
        resource-group: ${{ steps.set_defaults.outputs.resource-group }}
        workspace-name: ${{ steps.set_defaults.outputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        job-path: ${{ steps.parse_config.outputs.asset-path }}
        compute: ${{ steps.parse_config.outputs.compute || 'serverless' }}

    - name: Print Result
      shell: bash
      run: |
        if [ "${{ steps.parse_config.outputs.config-type }}" = "array" ] && [ -z "${{ inputs.index }}" ]; then
          echo "Sequential deployment completed for ${{ steps.parse_config.outputs.array-length }} items"
        else
          echo "Deployed asset type: ${{ steps.parse_config.outputs.asset-type }}"
          if [ -n "${{ inputs.index }}" ]; then
            echo "Deployed from array index: ${{ inputs.index }}"
          fi
          
          if [ "${{ steps.parse_config.outputs.asset-type }}" = "environment" ]; then
            echo "Resource ID: ${{ steps.deploy_environment.outputs.resource-id }}"
            echo "Asset Reference: ${{ steps.deploy_environment.outputs.environment-ref }}"
            echo "Asset Version: ${{ steps.deploy_environment.outputs.environment-version }}"
          elif [ "${{ steps.parse_config.outputs.asset-type }}" = "component" ]; then
            echo "Resource ID: ${{ steps.deploy_component.outputs.resource-id }}"
            echo "Asset Reference: ${{ steps.deploy_component.outputs.component-ref }}"
            echo "Asset Version: ${{ steps.deploy_component.outputs.component-version }}"
          elif [ "${{ steps.parse_config.outputs.asset-type }}" = "data" ]; then
            echo "Resource ID: ${{ steps.deploy_data.outputs.resource-id }}"
            echo "Asset Reference: ${{ steps.deploy_data.outputs.data-ref }}"
            echo "Asset Version: ${{ steps.deploy_data.outputs.data-version }}"
          elif [ "${{ steps.parse_config.outputs.asset-type }}" = "job" ]; then
            echo "Resource ID: ${{ steps.deploy_job.outputs.resource-id }}"
            echo "Asset Reference: ${{ steps.deploy_job.outputs.job-ref }}"
            echo "Asset Name: ${{ steps.deploy_job.outputs.job-name }}"
          fi
        fi
