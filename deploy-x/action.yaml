name: Deploy X
description: Universal deployment action for Azure ML assets. Dispatches to specific deployment actions based on asset type. Designed for use with matrix strategies for parallel deployment.
inputs:
  tenant-id:
    description: 'Azure tenant ID'
    required: true
  subscription-id:
    description: 'Azure subscription ID'
    required: true
  resource-group:
    description: 'Azure resource group name'
    required: true
  workspace-name:
    description: 'Azure Machine Learning workspace name'
    required: true
  client-id:
    description: 'Client ID configured with Federated Credentials'
    required: true
  asset-type:
    description: 'Type of Azure ML asset to deploy (environment, component, data, job)'
    required: true
  asset-path:
    description: 'Path to the asset definition file (YAML)'
    required: true
  type:
    description: 'Optional type parameter for data assets'
    required: false
  compute:
    description: 'Optional compute parameter for job assets (defaults to serverless)'
    required: false

outputs:
  resource-id:
    description: 'resource id of the deployed asset'
    value: ${{ steps.deploy_environment.outputs.resource-id || steps.deploy_component.outputs.resource-id || steps.deploy_data.outputs.resource-id || steps.deploy_job.outputs.resource-id }}
  asset-ref:
    description: 'reference string of asset within AzureML workspace'
    value: ${{ steps.deploy_environment.outputs.environment-ref || steps.deploy_component.outputs.component-ref || steps.deploy_data.outputs.data-ref || steps.deploy_job.outputs.job-ref }}
  asset-version:
    description: 'The registered version/name of the asset within the workspace'
    value: ${{ steps.deploy_environment.outputs.environment-version || steps.deploy_component.outputs.component-version || steps.deploy_data.outputs.data-version || steps.deploy_job.outputs.job-name }}

runs:
  using: "composite"
  steps:
    - name: Action Summary
      shell: bash
      run: |
        echo "Deploy X - Universal Azure ML Asset Deployment"
        echo "   Asset Type: ${{ inputs.asset-type }}"
        echo "   Asset Path: ${{ inputs.asset-path }}"
        echo "   Target: ${{ inputs.workspace-name }} in ${{ inputs.resource-group }}"
        if [ "${{ inputs.asset-type }}" = "data" ] && [ -n "${{ inputs.type }}" ]; then
          echo "   Data Type: ${{ inputs.type }}"
        fi
        if [ "${{ inputs.asset-type }}" = "job" ]; then
          echo "   Compute: ${{ inputs.compute || 'serverless' }}"
        fi
        echo ""

    - name: Validate inputs
      shell: bash
      run: |
        # Validate inputs
        VALIDATION_ERRORS=0
        
        # Validate asset-type
        case "${{ inputs.asset-type }}" in
          "environment"|"component"|"data"|"job")
            ;;
          *)
            echo "❌ Error: Invalid asset-type: ${{ inputs.asset-type }}"
            echo "   Valid asset types: environment, component, data, job"
            VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
            ;;
        esac
        
        if [ ! -f "${{ inputs.asset-path }}" ]; then
          echo "❌ Error: asset-path does not exist: ${{ inputs.asset-path }}"
          echo "   Please ensure the file exists and the path is correct"
          VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
        fi
        
        # Check for validation errors and exit if any found
        if [ $VALIDATION_ERRORS -gt 0 ]; then
          echo ""
          echo "❌ Validation failed with $VALIDATION_ERRORS error(s). Please fix the above issues and try again."
          exit 1
        fi
        
        echo "✅ Input validation passed"

    - name: Deploy Environment
      if: ${{ inputs.asset-type == 'environment' }}
      uses: equinor/ai-platform-actions/deploy-environment@develop
      id: deploy_environment
      with:
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        resource-group: ${{ inputs.resource-group }}
        workspace-name: ${{ inputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        environment-path: ${{ inputs.asset-path }}

    - name: Deploy Component
      if: ${{ inputs.asset-type == 'component' }}
      uses: equinor/ai-platform-actions/deploy-component@develop
      id: deploy_component
      with:
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        resource-group: ${{ inputs.resource-group }}
        workspace-name: ${{ inputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        component-path: ${{ inputs.asset-path }}

    - name: Deploy Data
      if: ${{ inputs.asset-type == 'data' }}
      uses: equinor/ai-platform-actions/deploy-data@develop
      id: deploy_data
      with:
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        resource-group: ${{ inputs.resource-group }}
        workspace-name: ${{ inputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        data-path: ${{ inputs.asset-path }}
        type: ${{ inputs.type }}

    - name: Deploy Job
      if: ${{ inputs.asset-type == 'job' }}
      uses: equinor/ai-platform-actions/deploy-job@develop
      id: deploy_job
      with:
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        resource-group: ${{ inputs.resource-group }}
        workspace-name: ${{ inputs.workspace-name }}
        client-id: ${{ inputs.client-id }}
        job-path: ${{ inputs.asset-path }}
        compute: ${{ inputs.compute || 'serverless' }}

    - name: Print Result
      shell: bash
      run: |
        # Print result
        
        echo "Deployed asset type: ${{ inputs.asset-type }}"
        echo "Asset path: ${{ inputs.asset-path }}"
        
        if [ "${{ inputs.asset-type }}" = "environment" ]; then
          echo "Resource ID: ${{ steps.deploy_environment.outputs.resource-id }}"
          echo "Asset Reference: ${{ steps.deploy_environment.outputs.environment-ref }}"
          echo "Asset Version: ${{ steps.deploy_environment.outputs.environment-version }}"
        elif [ "${{ inputs.asset-type }}" = "component" ]; then
          echo "Resource ID: ${{ steps.deploy_component.outputs.resource-id }}"
          echo "Asset Reference: ${{ steps.deploy_component.outputs.component-ref }}"
          echo "Asset Version: ${{ steps.deploy_component.outputs.component-version }}"
        elif [ "${{ inputs.asset-type }}" = "data" ]; then
          echo "Resource ID: ${{ steps.deploy_data.outputs.resource-id }}"
          echo "Asset Reference: ${{ steps.deploy_data.outputs.data-ref }}"
          echo "Asset Version: ${{ steps.deploy_data.outputs.data-version }}"
        elif [ "${{ inputs.asset-type }}" = "job" ]; then
          echo "Resource ID: ${{ steps.deploy_job.outputs.resource-id }}"
          echo "Asset Reference: ${{ steps.deploy_job.outputs.job-ref }}"
          echo "Asset Name: ${{ steps.deploy_job.outputs.job-name }}"
        fi