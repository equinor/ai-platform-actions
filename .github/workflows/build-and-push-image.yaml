name: Build and Push

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - inner-loop
          - outer-loop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: image-tags
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          MAJOR_TAG=$(echo "$RELEASE_TAG" | sed -E 's/^((v)?[0-9]+).*/\1/')
          echo "major-tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.action }}
          push: true
          tags: |
            ghcr.io/equinor/ai-platform-actions/${{ matrix.action }}:latest
            ghcr.io/equinor/ai-platform-actions/${{ matrix.action }}:${{ github.event.release.tag_name }}
            ghcr.io/equinor/ai-platform-actions/${{ matrix.action }}:${{ steps.image-tags.outputs.major-tag }}